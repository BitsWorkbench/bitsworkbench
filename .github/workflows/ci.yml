name: CI

on:
  pull_request:
  workflow_dispatch:

# Pushes to the default branch are covered by the deploy workflow, which runs
# this same suite against the bundle it is about to publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # The whole suite, the simulator's included, takes a few minutes; a hung
    # browser should not hold a runner for hours.
    timeout-minutes: 20
    # CodeAIR flight: the build fetches the flight library (sim/flight-library.json)
    # and the tests fly it.
    env:
      SIM_FLIGHT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # the simulator's MicroPython needs JSPI, on by default from Node 24
          cache: npm

      - run: npm ci

      - name: Install the browser the tests drive
        run: npx playwright install chromium

      # System libraries for that browser. The runner image already has
      # Chrome and its libraries, so this is a top-up: retry when the Ubuntu
      # mirror is flaky, and do not fail the build over it. If a library
      # really is missing, the tests themselves will say so.
      - name: Top up the browser's system libraries
        continue-on-error: true
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            echo "install-deps failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - run: npm run build

      - run: npm test

      # The tested bundle, for a preview on Firebase (the `preview` job below).
      - if: vars.FIREBASE_PROJECT_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3

      # The budget for a school Chromebook (tests/perf.mjs). A report only: a
      # runner's speed is not a Chromebook's, and it varies from run to run.
      - name: Performance budget (report)
        run: npm run perf
        continue-on-error: true

      # What the simulator's UI test saw, to read a failure on the runner.
      - name: Keep the test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore

  # The simulator as browsers without JSPI run it (Safari, so every iPad, and
  # Firefox): the Asyncify build of MicroPython (sim/DESIGN.md, section 1). Its
  # own job, beside build-and-test, so neither waits on the other.
  without-jspi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SIM_FLIGHT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Playwright's browsers, kept between runs for the version the lock file pins.
      - name: Cache the browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium-webkit-firefox

      - name: Install Chromium, WebKit and Firefox
        run: npx playwright install chromium webkit firefox

      # Their system libraries, retried when the Ubuntu mirror is flaky.
      - name: Install the browsers' system libraries
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            npx playwright install-deps chromium webkit firefox && exit 0
            echo "install-deps failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - run: npm run build

      # The simulator suites with the Asyncify build: headless, then in the app,
      # where the browser suite takes JSPI away from the page, which then
      # chooses the Asyncify build itself.
      - name: Simulator on the Asyncify build
        run: |
          OCB_SIM_VM=asyncify node tests/sim.mjs
          OCB_SIM_VM=asyncify node tests/sim-ui.mjs

      # Safari's engine and Firefox, which have no JSPI, for real; then WebKit
      # and Chromium's fallback on an iPad's screen.
      - name: Simulator in WebKit and Firefox, and on an iPad's screen
        run: |
          xvfb-run -a node tests/sim-engines.mjs
          OCB_ENGINES=webkit OCB_DEVICE='iPad (gen 7) landscape' node tests/sim-engines.mjs
          OCB_ENGINES=chromium OCB_SIM_VM=asyncify OCB_DEVICE='iPad (gen 7) landscape' node tests/sim-engines.mjs

      - name: Keep the test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-without-jspi
          path: tests/screenshots/
          if-no-files-found: ignore

  # A pull request's tested bundle on a Firebase preview channel, its address
  # posted on the pull request, kept a week: to look at a change before it
  # merges. Only once Firebase is set up (README, "Hosting on Firebase"), and
  # only for branches of this repository (a fork's pull request gets no secrets).
  preview:
    needs: build-and-test
    if: vars.FIREBASE_PROJECT_ID != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4      # firebase.json

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 7d
