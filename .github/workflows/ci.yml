name: CI

on:
  pull_request:
  workflow_dispatch:

# Pushes to the default branch are covered by the deploy workflow, which runs
# this same suite against the bundle it is about to publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # The whole suite, the simulator's included, takes a few minutes; a hung
    # browser should not hold a runner for hours.
    timeout-minutes: 20
    # CodeAIR flight: the build fetches the flight library (sim/flight-library.json)
    # and the tests fly it.
    env:
      SIM_FLIGHT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # the simulator's MicroPython needs JSPI, on by default from Node 24
          cache: npm

      - run: npm ci

      - name: Install the browser the tests drive
        run: npx playwright install chromium

      # System libraries for that browser. The runner image already has
      # Chrome and its libraries, so this is a top-up: retry when the Ubuntu
      # mirror is flaky, and do not fail the build over it. If a library
      # really is missing, the tests themselves will say so.
      - name: Top up the browser's system libraries
        continue-on-error: true
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            echo "install-deps failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - run: npm run build

      - run: npm test

      # The tested bundle, for a preview on Firebase (the `preview` job below).
      - if: github.repository == 'BitsWorkbench/bitsworkbench' && vars.FIREBASE_PROJECT_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3

      # The budget for a school Chromebook (tests/perf.mjs). A report only: a
      # runner's speed is not a Chromebook's, and it varies from run to run.
      - name: Performance budget (report)
        run: npm run perf
        continue-on-error: true

      # What the simulator's UI test saw, to read a failure on the runner.
      - name: Keep the test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore

  # The simulator as browsers without JSPI run it (Safari, so every iPad, and
  # Firefox): the Asyncify build of MicroPython (sim/DESIGN.md, section 1). Its
  # own job, beside build-and-test, so neither waits on the other.
  without-jspi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Playwright's own image for the version package-lock.json pins (keep the
    # two in step): Chromium, WebKit and Firefox with their system libraries
    # and xvfb, so nothing comes from the Ubuntu mirror, whose slow days took
    # WebKit's libraries past six minutes.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    env:
      SIM_FLIGHT: 1
      HOME: /root        # Firefox, as root in the container, wants a home of its own
      OCB_URL: http://127.0.0.1:4173/
    steps:
      # The image has no git, which the build's CodeAIR flight library is fetched with.
      - name: Install git
        timeout-minutes: 3
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # One server for the browser tests, on 127.0.0.1: in the container,
      # "localhost" is both 127.0.0.1 and ::1, and a server the tests start on
      # it themselves answers on one while they ask on the other.
      - name: Serve the build
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:4173/ && exit 0; sleep 0.5; done
          cat /tmp/preview.log; exit 1

      # The simulator suites with the Asyncify build: headless, then in the app,
      # where the browser suite takes JSPI away from the page, which then
      # chooses the Asyncify build itself.
      - name: Simulator on the Asyncify build
        run: |
          OCB_SIM_VM=asyncify node tests/sim.mjs
          OCB_SIM_VM=asyncify node tests/sim-ui.mjs

      # Safari's engine and Firefox, which have no JSPI, for real; then WebKit
      # and Chromium's fallback on an iPad's screen.
      - name: Simulator in WebKit and Firefox, and on an iPad's screen
        run: |
          xvfb-run -a node tests/sim-engines.mjs
          OCB_ENGINES=webkit OCB_DEVICE='iPad (gen 7) landscape' node tests/sim-engines.mjs
          OCB_ENGINES=chromium OCB_SIM_VM=asyncify OCB_DEVICE='iPad (gen 7) landscape' node tests/sim-engines.mjs

      # The free missions that come with the app, opened from Learn and stepped
      # through on the simulator in Safari's engine, on an iPad's screen.
      - name: Learn's packs in WebKit, on an iPad's screen
        run: OCB_ENGINES=webkit OCB_DEVICE='iPad (gen 7) landscape' node tests/learn-packs-ui.mjs

      - name: Keep the test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-without-jspi
          path: tests/screenshots/
          if-no-files-found: ignore

  # A pull request's tested bundle on a Firebase preview channel, its address
  # posted on the pull request, kept a week: to look at a change before it
  # merges. Firia's own, like the deploy workflow: only in BitsWorkbench/bitsworkbench
  # once Firebase is set up (README, "Deploying"), and only for branches of it
  # (a fork's pull request gets no secrets). A fork's own CI skips it.
  preview:
    needs: build-and-test
    if: github.repository == 'BitsWorkbench/bitsworkbench' && vars.FIREBASE_PROJECT_ID != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4      # firebase.json

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 7d
