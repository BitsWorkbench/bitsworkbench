# Publishes the site to Firebase Hosting, the live channel of Firia's project,
# on every merge to main: build, test the exact bundle, then deploy it.
#
# This is Firia's own deploy. It runs only in BitsWorkbench/bitsworkbench, and only
# once the repository has the variable FIREBASE_PROJECT_ID and the secret
# FIREBASE_SERVICE_ACCOUNT (README, "Deploying"). The credential lives only in
# that secret, never in a file. A fork skips this workflow quietly; to publish
# your own copy, see the README, "Deploying your own copy".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one that is already running: a
# half-deployed site is worse than a slightly stale one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'BitsWorkbench/bitsworkbench' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: firebase
      url: ${{ steps.publish.outputs.details_url }}
    # CodeAIR flight: the build fetches the flight library (sim/flight-library.json)
    # and the tests fly it.
    env:
      SIM_FLIGHT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # the simulator's MicroPython needs JSPI, on by default from Node 24
          cache: npm

      - run: npm ci

      - name: Install the browser the tests drive
        run: npx playwright install chromium

      # System libraries for that browser. The runner image already has
      # Chrome and its libraries, so this is a top-up: retry when the Ubuntu
      # mirror is flaky, and do not fail the build over it. If a library
      # really is missing, the tests themselves will say so.
      - name: Top up the browser's system libraries
        continue-on-error: true
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            echo "install-deps failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - run: npm run build

      # Teachers are pointed at this site, so test the exact bundle we are
      # about to publish. The same suite passed in the pull request's CI. The
      # browser and simulator tests run against real time, and this runner is
      # sometimes slower: a check that fails once is run again with the whole
      # suite, and the first failure stays on the run as a warning, so a flake
      # is seen rather than hidden. A real failure fails twice, and nothing is
      # published.
      - name: Test the build we are about to publish
        run: |
          if npm test; then exit 0; fi
          echo "::warning title=Flaky test::The test suite failed once on the deploy runner and is being run again. See the log above for the check that failed."
          npm test

      - id: publish
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
